<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick a style</title>
<style>
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: #e9ecef; color: #111; }
  header { padding: 14px 18px; background: #111; color: #fff; }
  header b { font-size: 17px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 14px; padding: 14px; }
  figure { margin: 0; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  figcaption { padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  figcaption a { color: #0b5cad; font-weight: 600; }
  iframe { width: 100%; height: 720px; border: 0; display: block; }
</style></head><body>
<header><b>Pick a style</b> — scroll and click inside each one. Open full size with the link.</header>
<div class="grid">
  <figure><figcaption><span><b>A. Newsroom</b> (current)</span><a href="index.html" target="_blank">Open full size ↗</a></figcaption><iframe src="index.html"></iframe></figure>
  <figure><figcaption><span><b>B. Clean modern</b> — soft cards, rounded</span><a href="index.html?theme=clean" target="_blank">Open full size ↗</a></figcaption><iframe src="index.html?theme=clean"></iframe></figure>
  <figure><figcaption><span><b>C. Editorial</b> — serif headlines, white</span><a href="index.html?theme=editorial" target="_blank">Open full size ↗</a></figcaption><iframe src="index.html?theme=editorial"></iframe></figure>
  <figure><figcaption><span><b>D. Civic portal</b> — government site look</span><a href="index.html?theme=civic" target="_blank">Open full size ↗</a></figcaption><iframe src="index.html?theme=civic"></iframe></figure>
</div></body></html>
